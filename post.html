<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Writing — Sandeep Midde</title>
<meta name="description" content="Articles by Sandeep Midde on platform modernization, delivery leadership, and applied AI." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%232dd4bf' text-anchor='middle'%3ESM%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        typography: () => ({
          invert: {
            css: {
              '--tw-prose-body': '#cbd5e1',
              '--tw-prose-headings': '#f1f5f9',
              '--tw-prose-links': '#2dd4bf',
              '--tw-prose-bold': '#f1f5f9',
              '--tw-prose-quotes': '#94a3b8',
              '--tw-prose-code': '#5eead4',
            },
          },
        }),
      },
    },
  };
</script>

<style>
  body { font-family: 'Manrope', sans-serif; letter-spacing: 0.01em; word-spacing: 0.1em; }
  ::selection { background-color: rgba(45, 212, 191, 0.25); color: #99f6e4; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #020617; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  .bg-glow {
    background:
      radial-gradient(600px circle at 15% 10%, rgba(45,212,191,0.10), transparent 60%),
      radial-gradient(500px circle at 85% 20%, rgba(56,189,248,0.08), transparent 60%);
  }
  #cursorGlow {
    position: fixed;
    top: 0;
    left: 0;
    width: 1300px;
    height: 1300px;
    border-radius: 9999px;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.09), rgba(226,255,250,0.05) 35%, transparent 70%);
    filter: blur(50px);
    transform: translate(-9999px, -9999px);
    will-change: transform;
  }
  .tag-chip {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    border-radius: 9999px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    border: none;
    color: #5eead4;
    background-color: rgba(45, 212, 191, 0.08);
    transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
    cursor: default;
  }
  .tag-chip:hover {
    color: #99f6e4;
    background-color: rgba(45, 212, 191, 0.18);
    box-shadow: 0 0 16px rgba(45, 212, 191, 0.25);
  }
  /* Images inside blog post body content — see posts/welcome-to-my-blog.json for an example */
  #postBody img {
    border-radius: 0.75rem;
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
  }
  #postBody figcaption {
    text-align: center;
    font-size: 0.8rem;
  }
  .related-card {
    border: none;
    background-color: transparent;
    transition: background-color .2s ease;
  }
  .related-card:hover {
    background-color: rgba(30, 41, 59, 0.4);
  }
  .related-card:hover .related-title { color: #5eead4; }
  #likeBtn {
    transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  #likeBtn.liked {
    color: #5eead4;
    background-color: rgba(45, 212, 191, 0.12);
  }
  /* Topic accordion (right column) */
  .topic-group summary {
    list-style: none;
    cursor: pointer;
  }
  .topic-group summary::-webkit-details-marker { display: none; }
  .topic-group summary:hover { background-color: rgba(30, 41, 59, 0.4); }
  .topic-group .chevron { transition: transform .2s ease; }
  .topic-group[open] .chevron { transform: rotate(180deg); }
  .topic-link.active { color: #5eead4; font-weight: 600; }
  /* Share row: plain links to each network's share page, so they work for every
     visitor on every browser with no sign-in to this site or GitHub. */
  .share-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 10px; border-radius: 9999px;
    background-color: rgba(30, 41, 59, 0.6); color: #94a3b8;
    transition: color .2s ease, background-color .2s ease;
  }
  .share-btn:hover { background-color: #1e293b; color: #e2e8f0; }
  .share-btn svg { width: 16px; height: 16px; }
  .share-btn.copied { color: #5eead4; background-color: rgba(45, 212, 191, 0.12); }
</style>
</head>

            <span aria-hidden="true">&larr;</span> Back to Blog

                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91A9.84 9.84 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23a8.23 8.23 0 0 1 8.23 8.24c0 4.54-3.7 8.23-8.23 8.23zm4.52-6.16c-.25-.12-1.46-.72-1.69-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.29z"/></svg>

                <span id="shareCopyLabel" class="text-xs font-medium">Copy link</span>

              <button id="shareNative" type="button" class="share-btn" style="display:none" aria-label="More sharing options" title="More sharing options">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>

  <script>
    // Cursor-following glow — purely decorative
    const cursorGlow = document.getElementById('cursorGlow');
    const glowRadius = 650;
    let targetX = -9999, targetY = -9999, glowX = -9999, glowY = -9999;
    window.addEventListener('mousemove', (e) => { targetX = e.clientX; targetY = e.clientY; });
    function animateGlow() {
      glowX += (targetX - glowX) * 0.12;
      glowY += (targetY - glowY) * 0.12;
      cursorGlow.style.transform = `translate(${glowX - glowRadius}px, ${glowY - glowRadius}px)`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    // ---- Post rendering ----
    // Generated pages at /posts/<slug>/ set window.POST_SLUG (see scripts/build-posts.mjs).
    // Old post.html?slug=... links are forwarded there, so shared links get a proper preview.
    const querySlug = new URLSearchParams(location.search).get('slug');
    if (!window.POST_SLUG && querySlug) {
      location.replace(`posts/${encodeURIComponent(querySlug)}/`);
    }
    const slug = window.POST_SLUG || querySlug;
    const loadingState = document.getElementById('loadingState');
    const postContent = document.getElementById('postContent');

    function formatDate(iso) {
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function showNotFound() {
      loadingState.innerHTML = `
        <p class="text-slate-300 font-medium">Post not found.</p>
        <p class="mt-2 text-sm text-slate-500">
          <a href="blog.html" class="text-teal-300 hover:underline">Back to the blog</a>
        </p>`;
    }

    if (!slug) {
      showNotFound();
    } else {
      fetch(`posts/${encodeURIComponent(slug)}.json`)
        .then(res => { if (!res.ok) throw new Error('not found'); return res.json(); })
        .then(post => {
          document.title = `${post.title} · Sandeep Midde`;
          document.getElementById('postDate').setAttribute('datetime', post.date);
          document.getElementById('postDate').textContent = formatDate(post.date);
          document.getElementById('postReadTime').textContent = post.readTime;
          document.getElementById('postTitle').textContent = post.title;
          document.getElementById('postBody').innerHTML = (post.body || []).join('');
          document.getElementById('postTags').innerHTML = (post.tags || [])
            .map(t => `<span class="tag-chip">${t}</span>`).join('');

          loadingState.classList.add('hidden');
          postContent.classList.remove('hidden');

          loadStats(post.slug);
          loadGiscus(post.slug);
          loadSidebars(post.slug, post.tags || []);
          setupShare(post.title);
        })
        .catch(showNotFound);
    }

    // ---- Right + left sidebars, both driven by the same posts-index.json fetch ----
    function loadSidebars(currentSlug, currentTags) {
      fetch('posts/posts-index.json')
        .then(res => res.json())
        .then(posts => {
          renderRelatedPosts(posts, currentSlug);
          renderTopicGroups(posts, currentSlug, currentTags);
        })
        .catch(() => {
          document.getElementById('relatedPosts').innerHTML = '';
          document.getElementById('topicGroups').innerHTML = '';
        });
    }

    // ---- "More from the blog" (left column) ----
    function renderRelatedPosts(posts, currentSlug) {
      const container = document.getElementById('relatedPosts');
      const others = posts
        .filter(p => p.slug !== currentSlug)
        .sort((a, b) => b.date.localeCompare(a.date));

      if (others.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-600">More posts coming soon.</p>';
        return;
      }

      container.innerHTML = others.map(p => `
        <a href="posts/${encodeURIComponent(p.slug)}/" title="${p.title}" class="related-card rounded-lg px-3 py-2 block">
          <div class="related-title line-clamp-2 text-sm font-semibold text-slate-200 transition-colors duration-300">${p.title}</div>
        </a>
      `).join('');
    }

    // ---- "Browse by Topic" (right column) — posts grouped into a collapsible accordion per tag.
    // A post can belong to several tags at once, so it can appear in more than one group. ----
    function renderTopicGroups(posts, currentSlug, currentTags) {
      const container = document.getElementById('topicGroups');

      const groups = {};
      posts.forEach(p => {
        (p.tags || []).forEach(tag => {
          (groups[tag] = groups[tag] || []).push(p);
        });
      });

      const topicNames = Object.keys(groups).sort();
      if (topicNames.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-600">No topics yet.</p>';
        return;
      }

      container.innerHTML = topicNames.map(name => {
        const items = groups[name].sort((a, b) => b.date.localeCompare(a.date));
        const isCurrentTopic = currentTags.includes(name);
        const links = items.map(p => `
          <a href="posts/${encodeURIComponent(p.slug)}/" title="${p.title}"
             class="topic-link line-clamp-2 py-1.5 pl-1 text-sm text-slate-400 hover:text-teal-300 transition-colors ${p.slug === currentSlug ? 'active' : ''}">
            ${p.title}
          </a>
        `).join('');
        return `
          <details class="topic-group rounded-lg" ${isCurrentTopic ? 'open' : ''}>
            <summary class="px-3 py-2 text-sm font-semibold text-slate-200 rounded-lg flex items-center justify-between gap-2">
              <span class="truncate">${name}</span>
              <span class="flex items-center gap-2 text-slate-500">
                <span class="text-xs">${items.length}</span>
                <svg class="chevron h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </span>
            </summary>
            <div class="pl-3 pb-2">${links}</div>
          </details>
        `;
      }).join('');
    }

    // ---- View + like counters (Cloudflare Pages Functions + Workers KV) ----
    async function loadStats(slug) {
      const viewCountEl = document.getElementById('viewCount');
      const likeCountEl = document.getElementById('likeCount');
      const likeBtn = document.getElementById('likeBtn');

      // View: increment at most once per 12h per browser, to avoid refresh-spam.
      const viewedKey = `viewed:${slug}`;
      const lastViewed = Number(localStorage.getItem(viewedKey)) || 0;
      const shouldCountView = Date.now() - lastViewed > 12 * 60 * 60 * 1000;
      try {
        const res = await fetch(shouldCountView ? '/api/view' : `/api/view?slug=${encodeURIComponent(slug)}`, shouldCountView ? {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug }),
        } : undefined);
        const data = await res.json();
        viewCountEl.textContent = data.views ?? 0;
        if (shouldCountView) localStorage.setItem(viewedKey, String(Date.now()));
      } catch (e) { /* counters are non-essential; fail silently */ }

      // Like: one like per browser, tracked via localStorage.
      const likedKey = `liked:${slug}`;
      const alreadyLiked = localStorage.getItem(likedKey) === '1';
      try {
        const res = await fetch(`/api/like?slug=${encodeURIComponent(slug)}`);
        const data = await res.json();
        likeCountEl.textContent = data.likes ?? 0;
      } catch (e) {}
      if (alreadyLiked) {
        likeBtn.classList.add('liked');
        likeBtn.disabled = true;
      }
      likeBtn.addEventListener('click', async () => {
        if (localStorage.getItem(likedKey) === '1') return;
        try {
          const res = await fetch('/api/like', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug }),
          });
          const data = await res.json();
          likeCountEl.textContent = data.likes ?? 0;
          localStorage.setItem(likedKey, '1');
          likeBtn.classList.add('liked');
          likeBtn.disabled = true;
        } catch (e) {}
      });
    }

    // ---- Share: direct links (work for everyone, no sign-in), copy link, native sheet on phones ----
    function setupShare(title) {
      const url = location.origin + location.pathname;   // clean post URL, no query or #hash
      const u = encodeURIComponent(url), t = encodeURIComponent(title);
      document.getElementById('shareLinkedIn').href = `https://www.linkedin.com/sharing/share-offsite/?url=${u}`;
      document.getElementById('shareWhatsApp').href = `https://wa.me/?text=${encodeURIComponent(title + ' ' + url)}`;
      document.getElementById('shareX').href = `https://twitter.com/intent/tweet?url=${u}&text=${t}`;
      document.getElementById('shareEmail').href = `mailto:?subject=${t}&body=${encodeURIComponent(title + '\n\n' + url)}`;

      const copyBtn = document.getElementById('shareCopy');
      const copyLabel = document.getElementById('shareCopyLabel');
      const legacyCopy = () => {   // for browsers or contexts without the async clipboard API
        const ta = document.createElement('textarea');
        ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove(); return ok;
      };
      copyBtn.addEventListener('click', async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(url); ok = true; } catch (e) { ok = legacyCopy(); }
        if (!ok) { window.prompt('Copy this link', url); return; }
        copyLabel.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyLabel.textContent = 'Copy link'; copyBtn.classList.remove('copied'); }, 2000);
      });

      // Phones and tablets: also offer the device's own share sheet (Messages, Slack, etc.)
      const nativeBtn = document.getElementById('shareNative');
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        nativeBtn.style.display = "";
        nativeBtn.addEventListener('click', async () => {
          try { await navigator.share({ title, url }); } catch (e) { /* closed the sheet */ }
        });
      }
    }
