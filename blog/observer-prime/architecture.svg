<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="880" height="340" rx="16" fill="#0f172a"/>
  <text x="30" y="40" fill="#5eead4" font-size="18" font-weight="700">One app, one process, no database</text>

  <g text-anchor="middle">
    <rect x="30" y="80" width="170" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="115" y="118" fill="#e2e8f0" font-size="16" font-weight="700">Browser</text>
    <text x="115" y="142" fill="#94a3b8" font-size="12.5">step-by-step wizard</text>
    <text x="115" y="160" fill="#94a3b8" font-size="12.5">laptop or phone</text>

    <rect x="240" y="80" width="160" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="320" y="118" fill="#e2e8f0" font-size="16" font-weight="700">API routes</text>
    <text x="320" y="142" fill="#94a3b8" font-size="12.5">projects · steps</text>
    <text x="320" y="160" fill="#94a3b8" font-size="12.5">prompts · exports</text>

    <rect x="440" y="80" width="180" height="100" rx="12" fill="#1e293b" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <text x="530" y="118" fill="#e2e8f0" font-size="16" font-weight="700">Orchestrator</text>
    <text x="530" y="142" fill="#94a3b8" font-size="12.5">workflow rules, versions,</text>
    <text x="530" y="160" fill="#94a3b8" font-size="12.5">minimal context per call</text>

    <rect x="440" y="230" width="180" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="530" y="262" fill="#e2e8f0" font-size="16" font-weight="700">Local files</text>
    <text x="530" y="286" fill="#94a3b8" font-size="12.5">JSON + Markdown</text>

    <rect x="670" y="60" width="180" height="254" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="760" y="92" fill="#e2e8f0" font-size="16" font-weight="700">AI providers</text>
    <g font-size="13.5" fill="#e2e8f0">
      <rect x="690" y="108" width="140" height="30" rx="8" fill="#0f172a"/><text x="760" y="128">Mock ($0)</text>
      <rect x="690" y="146" width="140" height="30" rx="8" fill="#0f172a"/><text x="760" y="166">Claude</text>
      <rect x="690" y="184" width="140" height="30" rx="8" fill="#0f172a"/><text x="760" y="204">OpenAI</text>
      <rect x="690" y="222" width="140" height="30" rx="8" fill="#0f172a"/><text x="760" y="242">Gemini</text>
      <rect x="690" y="260" width="140" height="30" rx="8" fill="#0f172a"/><text x="760" y="280">Grok</text>
    </g>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none">
    <line x1="202" y1="130" x2="237" y2="130" marker-end="url(#arr)"/>
    <line x1="402" y1="130" x2="437" y2="130" marker-end="url(#arr)"/>
    <line x1="622" y1="130" x2="667" y2="130" marker-end="url(#arr)"/>
    <line x1="530" y1="182" x2="530" y2="227" marker-end="url(#arr)"/>
  </g>
  <text x="115" y="262" fill="#94a3b8" font-size="12.5" text-anchor="middle">Next.js 15 · React 19</text>
  <text x="115" y="282" fill="#94a3b8" font-size="12.5" text-anchor="middle">TypeScript · Tailwind</text>
</svg>
