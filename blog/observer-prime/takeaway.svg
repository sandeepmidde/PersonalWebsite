<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker></defs>
  <rect width="400" height="410" rx="18" fill="#0E1525"/>
  <text x="24" y="42" fill="#34D399" font-size="18" font-weight="700">Human-in-the-loop, in three rules</text>
  <rect x="24" y="66" width="352" height="96" rx="12" fill="#172238" stroke="#2B3A57" stroke-width="1"/>
  <circle cx="58" cy="114" r="17" fill="#34D399"/>
  <text x="58" y="120" text-anchor="middle" fill="#0E1525" font-size="16" font-weight="700">1</text>
  <text x="92" y="110" text-anchor="start" fill="#F3F4F6" font-size="17" font-weight="700">Split the work</text>
  <text x="92" y="134" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">into decisions a person can make</text>
  <rect x="24" y="178" width="352" height="96" rx="12" fill="#172238" stroke="#2B3A57" stroke-width="1"/>
  <circle cx="58" cy="226" r="17" fill="#34D399"/>
  <text x="58" y="232" text-anchor="middle" fill="#0E1525" font-size="16" font-weight="700">2</text>
  <text x="92" y="222" text-anchor="start" fill="#F3F4F6" font-size="17" font-weight="700">Scope the context</text>
  <text x="92" y="246" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">only what that step needs</text>
  <rect x="24" y="290" width="352" height="96" rx="12" fill="#172238" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="58" cy="338" r="17" fill="#34D399"/>
  <text x="58" y="344" text-anchor="middle" fill="#0E1525" font-size="16" font-weight="700">3</text>
  <text x="92" y="334" text-anchor="start" fill="#F3F4F6" font-size="17" font-weight="700">Gate on approval</text>
  <text x="92" y="358" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">a human yes between stages</text>
</svg>
