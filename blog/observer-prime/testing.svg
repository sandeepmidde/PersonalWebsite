  <text x="156" y="333" text-anchor="start" fill="#F3F4F6" font-size="14.5" font-weight="400">reopen a step and every</text>
  <text x="156" y="355" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">step after it is cleared</text>
