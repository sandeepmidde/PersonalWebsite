<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker></defs>
  <rect width="400" height="410" rx="18" fill="#0E1525"/>
  <text x="24" y="42" fill="#34D399" font-size="18" font-weight="700">Testing failure safely</text>
  <rect x="24" y="66" width="352" height="96" rx="12" fill="#172238" stroke="#2B3A57" stroke-width="1"/>
  <text x="42" y="126" text-anchor="start" fill="#34D399" font-size="34" font-weight="800">36</text>
  <text x="156" y="109" text-anchor="start" fill="#F3F4F6" font-size="14.5" font-weight="400">automated tests in Vitest,</text>
  <text x="156" y="131" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">run fully offline</text>
