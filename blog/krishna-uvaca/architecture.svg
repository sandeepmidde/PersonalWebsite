<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E3B23C"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="16" fill="#12121A"/>
  <text x="30" y="40" fill="#E3B23C" font-size="18" font-weight="700">Krishna Uvaca: the system at a glance</text>

  <!-- Android app -->
  <rect x="30" y="70" width="240" height="370" rx="12" fill="#1B1C26" stroke="#E3B23C" stroke-opacity="0.6"/>
  <text x="150" y="102" fill="#F4F0E6" font-size="17" font-weight="700" text-anchor="middle">Android app</text>
  <text x="150" y="124" fill="#A6A2B0" font-size="13" text-anchor="middle">Kotlin · Jetpack Compose · MVVM</text>
  <g font-size="13.5" fill="#F4F0E6" text-anchor="middle">
    <rect x="50" y="146" width="200" height="34" rx="8" fill="#242531"/><text x="150" y="168">Home · verse of the day</text>
    <rect x="50" y="192" width="200" height="34" rx="8" fill="#242531"/><text x="150" y="214">Chat with citations</text>
    <rect x="50" y="238" width="200" height="34" rx="8" fill="#242531"/><text x="150" y="260">History (on device)</text>
    <rect x="50" y="284" width="200" height="34" rx="8" fill="#242531"/><text x="150" y="306">Bookmarks</text>
    <rect x="50" y="330" width="200" height="34" rx="8" fill="#242531"/><text x="150" y="352">Profile · memory view</text>
  </g>
  <text x="150" y="400" fill="#A6A2B0" font-size="12.5" text-anchor="middle">Conversations stay on the phone,</text>
  <text x="150" y="418" fill="#A6A2B0" font-size="12.5" text-anchor="middle">stored locally</text>

  <!-- Backend -->
  <rect x="320" y="70" width="240" height="370" rx="12" fill="#1B1C26" stroke="#5B84A6" stroke-opacity="0.8"/>
  <text x="440" y="102" fill="#F4F0E6" font-size="17" font-weight="700" text-anchor="middle">Backend API</text>
  <text x="440" y="124" fill="#A6A2B0" font-size="13" text-anchor="middle">Python · FastAPI</text>
  <g font-size="13.5" fill="#F4F0E6" text-anchor="middle">
    <rect x="340" y="146" width="200" height="34" rx="8" fill="#242531"/><text x="440" y="168">Identity by device ID</text>
    <rect x="340" y="192" width="200" height="34" rx="8" fill="#242531"/><text x="440" y="214">Chat orchestration</text>
    <rect x="340" y="238" width="200" height="34" rx="8" fill="#242531"/><text x="440" y="260">Mood detection</text>
    <rect x="340" y="284" width="200" height="34" rx="8" fill="#242531"/><text x="440" y="306">Memory extraction</text>
    <rect x="340" y="330" width="200" height="34" rx="8" fill="#242531"/><text x="440" y="352">Bookmarks</text>
  </g>
  <text x="440" y="400" fill="#A6A2B0" font-size="12.5" text-anchor="middle">Never stores full chat transcripts,</text>
  <text x="440" y="418" fill="#A6A2B0" font-size="12.5" text-anchor="middle">only a small list of facts</text>

  <!-- App <-> Backend -->
  <line x1="274" y1="255" x2="316" y2="255" stroke="#E3B23C" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="295" y="245" fill="#A6A2B0" font-size="11" text-anchor="middle">HTTPS</text>

  <!-- Right column -->
  <g text-anchor="middle">
    <rect x="610" y="70" width="240" height="105" rx="12" fill="#1B1C26" stroke="#A6A2B0" stroke-opacity="0.5"/>
    <text x="730" y="104" fill="#F4F0E6" font-size="16" font-weight="700">Gita knowledge base</text>
    <text x="730" y="128" fill="#A6A2B0" font-size="13">Source translations, chunked</text>
    <text x="730" y="148" fill="#A6A2B0" font-size="13">and embedded into ChromaDB</text>

    <rect x="610" y="197" width="240" height="105" rx="12" fill="#1B1C26" stroke="#A6A2B0" stroke-opacity="0.5"/>
    <text x="730" y="231" fill="#F4F0E6" font-size="16" font-weight="700">Language model</text>
    <text x="730" y="255" fill="#A6A2B0" font-size="13">Anthropic · OpenAI · Groq</text>
    <text x="730" y="275" fill="#A6A2B0" font-size="13">swappable by configuration</text>

    <rect x="610" y="324" width="240" height="116" rx="12" fill="#1B1C26" stroke="#A6A2B0" stroke-opacity="0.5"/>
    <text x="730" y="360" fill="#F4F0E6" font-size="16" font-weight="700">Airtable</text>
    <text x="730" y="384" fill="#A6A2B0" font-size="13">Users · memory facts</text>
    <text x="730" y="404" fill="#A6A2B0" font-size="13">bookmarks · analytics</text>
  </g>
  <g stroke="#E3B23C" stroke-width="2" fill="none">
    <line x1="560" y1="163" x2="606" y2="123" marker-end="url(#arr)"/>
    <line x1="560" y1="255" x2="606" y2="250" marker-end="url(#arr)"/>
    <line x1="560" y1="347" x2="606" y2="380" marker-end="url(#arr)"/>
  </g>
</svg>
