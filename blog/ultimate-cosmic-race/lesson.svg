<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D97706" stop-opacity="0.45"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#DB2777" stop-opacity="0.4"/><stop offset="1" stop-color="#DB2777" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowW" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#DC2626" stop-opacity="0.35"/><stop offset="1" stop-color="#DC2626" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBF2"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
  </defs>
  <rect width="400" height="404" rx="18" fill="url(#bg)" stroke="#1F1147" stroke-width="4"/>
  <text x="28" y="40" text-anchor="start" fill="#D97706" font-size="11.5" font-weight="800" letter-spacing="1.6">THE LESSON IN THREE MOVES</text>
  <rect x="28" y="62" width="344" height="94" rx="16" fill="url(#tile)" stroke="#1F1147" stroke-width="1"/>
  <circle cx="66" cy="109" r="19" fill="#D97706"/>  <text x="66" y="116" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">1</text>
  <text x="102" y="104" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Break it into pieces</text>
  <text x="102" y="128" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">small chunks of your data</text>
  <rect x="28" y="174" width="344" height="94" rx="16" fill="url(#tile)" stroke="#1F1147" stroke-width="1"/>
  <circle cx="66" cy="221" r="19" fill="#D97706"/>  <text x="66" y="228" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">2</text>
  <text x="102" y="216" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Map the meaning</text>
  <text x="102" y="240" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">embed every chunk</text>
  <rect x="28" y="286" width="344" height="94" rx="16" fill="url(#tile)" stroke="#D97706" stroke-width="2"/>
  <circle cx="66" cy="333" r="19" fill="#D97706"/>  <text x="66" y="340" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">3</text>
  <text x="102" y="328" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Walk the circle</text>
  <text x="102" y="352" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">retrieve only the nearest</text>
</svg>
