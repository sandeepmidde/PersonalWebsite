<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="400" height="470" rx="18" fill="#FFF7E6" stroke="#1F1147" stroke-width="4"/>
  <text x="24" y="40" fill="#D97706" font-size="13" font-weight="700" letter-spacing="1.5">TWO RULES, ONE TRAP</text>
  <rect x="24" y="56" width="168" height="72" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1.5"/>
  <text x="108" y="86" text-anchor="middle" fill="#1F1147" font-size="14.5" font-weight="700">Stay silent</text>
  <text x="108" y="108" text-anchor="middle" fill="#5B4B73" font-size="12">or Betal flies back</text>
  <rect x="208" y="56" width="168" height="72" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1.5"/>
  <text x="292" y="86" text-anchor="middle" fill="#1F1147" font-size="14.5" font-weight="700">Answer if you know</text>
  <text x="292" y="108" text-anchor="middle" fill="#5B4B73" font-size="12">or your head bursts</text>
  <path d="M108,132 L200,164 L292,132" fill="none" stroke="#1F1147" stroke-width="2"/>
  <rect x="24" y="168" width="352" height="96" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="44" y="194" fill="#DC2626" font-size="14.5" font-weight="700">Tales 1 to 24, Vikram knows</text>
  <text x="44" y="216" fill="#5B4B73" font-size="12.5">He must break one rule. He speaks.</text>
  <text x="44" y="236" fill="#5B4B73" font-size="12.5">Betal flies back. The walk restarts.</text>
  <rect x="24" y="280" width="352" height="96" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="44" y="306" fill="#15803D" font-size="14.5" font-weight="700">Tale 25, Vikram does not know</text>
  <text x="44" y="328" fill="#5B4B73" font-size="12.5">Silence breaks neither rule.</text>
  <text x="44" y="348" fill="#5B4B73" font-size="12.5">The walk is finally complete.</text>
  <rect x="24" y="392" width="352" height="56" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="200" y="416" text-anchor="middle" fill="#7C3AED" font-size="13" font-weight="700">In a prompt, never force an answer</text>
  <text x="200" y="436" text-anchor="middle" fill="#5B4B73" font-size="12.5">leave a safe way to say "I don't know"</text>
</svg>
