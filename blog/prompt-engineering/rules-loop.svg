<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
  <rect width="400" height="440" rx="18" fill="#FFF7E6" stroke="#1F1147" stroke-width="4"/>
  <text x="24" y="40" fill="#D97706" font-size="13" font-weight="700" letter-spacing="1.5">BETAL'S RULES</text>
  <rect x="24" y="60" width="352" height="60" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1.5"/>
  <text x="44" y="86" fill="#1F1147" font-size="15" font-weight="700">Story, then a riddle</text>
  <text x="44" y="106" fill="#5B4B73" font-size="12.5">the same shape every time</text>
  <line x1="120" y1="120" x2="90" y2="156" stroke="#D97706" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="280" y1="120" x2="310" y2="156" stroke="#D97706" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="24" y="160" width="168" height="110" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="108" y="190" text-anchor="middle" fill="#DC2626" font-size="14" font-weight="700">Knows, stays silent</text>
  <text x="108" y="214" text-anchor="middle" fill="#5B4B73" font-size="12.5">his head will burst</text>
  <text x="108" y="246" text-anchor="middle" fill="#5B4B73" font-size="12" font-style="italic">a hard constraint</text>
  <rect x="208" y="160" width="168" height="110" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="292" y="190" text-anchor="middle" fill="#7C3AED" font-size="14" font-weight="700">Speaks the answer</text>
  <text x="292" y="214" text-anchor="middle" fill="#5B4B73" font-size="12.5">Betal flies back</text>
  <text x="292" y="246" text-anchor="middle" fill="#5B4B73" font-size="12" font-style="italic">the loop restarts</text>
  <rect x="24" y="290" width="352" height="126" rx="12" fill="#FFF1D6" stroke="#D97706" stroke-width="2"/>
  <text x="44" y="318" fill="#1F1147" font-size="15" font-weight="700">For a model</text>
  <g font-size="13" fill="#5B4B73">
    <text x="44" y="344">Clear rules and a fixed pattern</text>
    <text x="44" y="366">make an unpredictable storyteller</text>
    <text x="44" y="388">behave the same way every turn</text>
  </g>
</svg>
