<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 434" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#14203A"/></linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F2C04E" stop-opacity="0.45"/><stop offset="1" stop-color="#F2C04E" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C2A47"/><stop offset="1" stop-color="#152139"/></linearGradient>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F2C04E"/></marker>
  </defs>
  <rect width="400" height="434" rx="18" fill="url(#bg)"/>
  <text x="28" y="40" fill="#F2C04E" font-size="11.5" font-weight="800" letter-spacing="1.6">RAG PIPELINE IN THREE STEPS</text>
  <rect x="28" y="62" width="344" height="100" rx="16" fill="url(#tile)" stroke="#2C3A58" stroke-width="1"/>
  <circle cx="66" cy="112" r="19" fill="#F2C04E"/><text x="66" y="119" text-anchor="middle" fill="#0B1220" font-size="17" font-weight="800">1</text>
  <text x="102" y="98" text-anchor="start" fill="#F1F4FA" font-size="17" font-weight="700">Ingest</text>
  <text x="102" y="121" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">Chunk files, store as vectors</text>
  <text x="102" y="143" text-anchor="start" fill="#F2C04E" font-size="13.5" font-weight="400" font-style="italic">Hanuman reads the mountain</text>
  <line x1="66" y1="164" x2="66" y2="180" stroke="#F2C04E" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="28" y="184" width="344" height="100" rx="16" fill="url(#tile)" stroke="#2C3A58" stroke-width="1"/>
  <circle cx="66" cy="234" r="19" fill="#F2C04E"/><text x="66" y="241" text-anchor="middle" fill="#0B1220" font-size="17" font-weight="800">2</text>
  <text x="102" y="220" text-anchor="start" fill="#F1F4FA" font-size="17" font-weight="700">Retrieve</text>
  <text x="102" y="243" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">Pull the closest passages</text>
  <text x="102" y="265" text-anchor="start" fill="#F2C04E" font-size="13.5" font-weight="400" font-style="italic">He lifts the whole ridge</text>
  <line x1="66" y1="286" x2="66" y2="302" stroke="#F2C04E" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="28" y="306" width="344" height="100" rx="16" fill="url(#tile)" stroke="#F2C04E" stroke-width="2"/>
  <circle cx="66" cy="356" r="19" fill="#F2C04E"/><text x="66" y="363" text-anchor="middle" fill="#0B1220" font-size="17" font-weight="800">3</text>
  <text x="102" y="342" text-anchor="start" fill="#F1F4FA" font-size="17" font-weight="700">Generate</text>
  <text x="102" y="365" text-anchor="start" fill="#A9B4C8" font-size="14" font-weight="400">LLM writes a grounded answer</text>
  <text x="102" y="387" text-anchor="start" fill="#F2C04E" font-size="13.5" font-weight="400" font-style="italic">The physician heals the prince</text>
