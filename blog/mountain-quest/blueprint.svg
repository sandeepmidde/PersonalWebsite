<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 434" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D97706" stop-opacity="0.45"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBF2"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
  </defs>
  <rect width="400" height="434" rx="18" fill="url(#bg)" stroke="#1F1147" stroke-width="4"/>
  <text x="28" y="40" fill="#D97706" font-size="11.5" font-weight="800" letter-spacing="1.6">FETCH, THEN ANSWER</text>
  <rect x="28" y="62" width="344" height="100" rx="16" fill="url(#tile)" stroke="#1F1147" stroke-width="1"/>
  <circle cx="66" cy="112" r="19" fill="#D97706"/><text x="66" y="119" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">1</text>
  <text x="102" y="98" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Prepare</text>
  <text x="102" y="121" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">Cut documents into small pieces</text>
  <text x="102" y="143" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">Hanuman reads the mountain</text>
  <line x1="66" y1="164" x2="66" y2="180" stroke="#D97706" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="28" y="184" width="344" height="100" rx="16" fill="url(#tile)" stroke="#1F1147" stroke-width="1"/>
  <circle cx="66" cy="234" r="19" fill="#D97706"/><text x="66" y="241" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">2</text>
  <text x="102" y="220" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Fetch</text>
  <text x="102" y="243" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">Bring back the closest pieces</text>
  <text x="102" y="265" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">He lifts the whole ridge</text>
  <line x1="66" y1="286" x2="66" y2="302" stroke="#D97706" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="28" y="306" width="344" height="100" rx="16" fill="url(#tile)" stroke="#D97706" stroke-width="2"/>
  <circle cx="66" cy="356" r="19" fill="#D97706"/><text x="66" y="363" text-anchor="middle" fill="#FFF7E6" font-size="17" font-weight="800">3</text>
  <text x="102" y="342" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Answer</text>
  <text x="102" y="365" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">The AI answers from those pieces</text>
  <text x="102" y="387" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">The physician heals the prince</text>
</svg>
