<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 544" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
  <rect width="400" height="544" rx="18" fill="#FFF7E6" stroke="#1F1147" stroke-width="4"/>
  <text x="24" y="42" fill="#D97706" font-size="18" font-weight="700">RAG in four steps</text>
  <rect x="24" y="66" width="352" height="96" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1"/>
  <circle cx="58" cy="114" r="17" fill="#D97706"/>
  <text x="58" y="120" text-anchor="middle" fill="#FFF7E6" font-size="16" font-weight="700">1</text>
  <text x="92" y="99" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Ask</text>
  <text x="92" y="122" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">A user asks a question</text>
  <text x="92" y="144" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">The fish begins to spin</text>
  <line x1="58" y1="162" x2="58" y2="182" stroke="#D97706" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="24" y="184" width="352" height="96" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1"/>
  <circle cx="58" cy="232" r="17" fill="#D97706"/>
  <text x="58" y="238" text-anchor="middle" fill="#FFF7E6" font-size="16" font-weight="700">2</text>
  <text x="92" y="217" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Retrieve</text>
  <text x="92" y="240" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">Search the knowledge base</text>
  <text x="92" y="262" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">Arjuna reads the reflection</text>
  <line x1="58" y1="280" x2="58" y2="300" stroke="#D97706" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="24" y="302" width="352" height="96" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1"/>
  <circle cx="58" cy="350" r="17" fill="#D97706"/>
  <text x="58" y="356" text-anchor="middle" fill="#FFF7E6" font-size="16" font-weight="700">3</text>
  <text x="92" y="335" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Augment</text>
  <text x="92" y="358" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">Add the best passages as context</text>
  <text x="92" y="380" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">He locks onto the eye</text>
  <line x1="58" y1="398" x2="58" y2="418" stroke="#D97706" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="24" y="420" width="352" height="96" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="58" cy="468" r="17" fill="#D97706"/>
  <text x="58" y="474" text-anchor="middle" fill="#FFF7E6" font-size="16" font-weight="700">4</text>
  <text x="92" y="453" text-anchor="start" fill="#1F1147" font-size="17" font-weight="700">Generate</text>
  <text x="92" y="476" text-anchor="start" fill="#5B4B73" font-size="14" font-weight="400">Answer from that evidence</text>
  <text x="92" y="498" text-anchor="start" fill="#D97706" font-size="13.5" font-weight="400" font-style="italic">The arrow flies true</text>
</svg>
