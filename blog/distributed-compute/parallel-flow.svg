<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs>
  <rect width="400" height="470" rx="18" fill="#FFF7E6" stroke="#1F1147" stroke-width="4"/>
  <text x="24" y="40" fill="#D97706" font-size="13" font-weight="700" letter-spacing="1.5">SPLIT, WORK TOGETHER, COMBINE</text>
  <rect x="100" y="58" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#1F1147" stroke-width="1.5"/>
  <text x="200" y="83" text-anchor="middle" fill="#1F1147" font-size="15" font-weight="700">One huge job</text>
  <text x="200" y="102" text-anchor="middle" fill="#5B4B73" font-size="12.5">the elephant</text>
  <g stroke="#D97706" stroke-width="2" marker-end="url(#arr)">
    <line x1="160" y1="114" x2="70" y2="168"/><line x1="185" y1="114" x2="160" y2="168"/><line x1="215" y1="114" x2="240" y2="168"/><line x1="240" y1="114" x2="330" y2="168"/>
  </g>
  <g>
    <rect x="34" y="172" width="72" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="124" y="172" width="72" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="204" y="172" width="72" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="294" y="172" width="72" height="100" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <g fill="#D97706" stroke="#1F1147" stroke-width="1.5">
    <rect x="58" y="190" width="24" height="24" rx="4"/><rect x="148" y="190" width="24" height="24" rx="4"/><rect x="228" y="190" width="24" height="24" rx="4"/><rect x="318" y="190" width="24" height="24" rx="4"/>
  </g>
  <g font-size="12" fill="#5B4B73" text-anchor="middle">
    <text x="70" y="240">Machine 1</text><text x="160" y="240">Machine 2</text><text x="240" y="240">Machine 3</text><text x="330" y="240">Machine 4</text>
    <text x="70" y="260">one piece</text><text x="160" y="260">one piece</text><text x="240" y="260">one piece</text><text x="330" y="260">one piece</text>
  </g>
  <g stroke="#D97706" stroke-width="2" marker-end="url(#arr)">
    <line x1="70" y1="272" x2="160" y2="326"/><line x1="160" y1="272" x2="185" y2="326"/><line x1="240" y1="272" x2="215" y2="326"/><line x1="330" y1="272" x2="240" y2="326"/>
  </g>
  <rect x="100" y="330" width="200" height="56" rx="12" fill="#FFF1D6" stroke="#D97706" stroke-width="2"/>
  <text x="200" y="355" text-anchor="middle" fill="#1F1147" font-size="15" font-weight="700">Combine the results</text>
  <text x="200" y="374" text-anchor="middle" fill="#5B4B73" font-size="12.5">add up the stones</text>
  <text x="200" y="420" text-anchor="middle" fill="#DB2777" font-size="13" font-style="italic">Each new question goes</text>
  <text x="200" y="440" text-anchor="middle" fill="#DB2777" font-size="13" font-style="italic">to a machine with room</text>
</svg>
