<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="16" fill="#0f172a"/>
  <text x="30" y="40" fill="#5eead4" font-size="18" font-weight="700">Elara: AI-assisted, not AI-dependent</text>
  <g font-size="12" fill="#94a3b8">
    <rect x="560" y="28" width="14" height="14" rx="3" fill="#1e293b" stroke="#2dd4bf"/><text x="580" y="40">AI step</text>
    <rect x="650" y="28" width="14" height="14" rx="3" fill="#1e293b" stroke="#475569"/><text x="670" y="40">plain application logic</text>
  </g>

  <!-- Drive -->
  <rect x="30" y="70" width="190" height="320" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="125" y="100" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">Your Google Drive</text>
  <text x="125" y="120" fill="#94a3b8" font-size="12.5" text-anchor="middle">just drop files in</text>
  <g font-size="13.5" fill="#e2e8f0" text-anchor="middle">
    <rect x="50" y="138" width="150" height="30" rx="8" fill="#0f172a"/><text x="125" y="158">PDFs</text>
    <rect x="50" y="176" width="150" height="30" rx="8" fill="#0f172a"/><text x="125" y="196">Images</text>
    <rect x="50" y="214" width="150" height="30" rx="8" fill="#0f172a"/><text x="125" y="234">Links</text>
    <rect x="50" y="252" width="150" height="30" rx="8" fill="#0f172a"/><text x="125" y="272">Notes</text>
    <rect x="50" y="290" width="150" height="30" rx="8" fill="#0f172a"/><text x="125" y="310">Resumes · JDs</text>
  </g>
  <text x="125" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">Elara's own data also</text>
  <text x="125" y="367" fill="#94a3b8" font-size="12" text-anchor="middle">lives here, in AI/</text>

  <!-- Top row -->
  <g text-anchor="middle">
    <rect x="270" y="70" width="180" height="76" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="360" y="100" fill="#e2e8f0" font-size="15" font-weight="700">Change detection</text>
    <text x="360" y="123" fill="#94a3b8" font-size="12.5">only new or changed files</text>

    <rect x="470" y="70" width="180" height="76" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="560" y="100" fill="#e2e8f0" font-size="15" font-weight="700">Chunk &amp; condense</text>
    <text x="560" y="123" fill="#94a3b8" font-size="12.5">long docs, summarised in parts</text>

    <rect x="670" y="70" width="180" height="76" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="760" y="100" fill="#e2e8f0" font-size="15" font-weight="700">Tier 1 · Indexer</text>
    <text x="760" y="123" fill="#94a3b8" font-size="12.5">fast, low-cost model, once</text>
  </g>

  <!-- Knowledge layer -->
  <rect x="270" y="186" width="580" height="92" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="290" y="210" fill="#e2e8f0" font-size="14" font-weight="700">Knowledge layer</text>
  <g font-size="13.5" fill="#e2e8f0" text-anchor="middle">
    <rect x="290" y="224" width="170" height="36" rx="8" fill="#0f172a"/><text x="375" y="247">Knowledge Cards</text>
    <rect x="475" y="224" width="170" height="36" rx="8" fill="#0f172a"/><text x="560" y="247">Search index</text>
    <rect x="660" y="224" width="170" height="36" rx="8" fill="#0f172a"/><text x="745" y="247">Concept graph</text>
  </g>

  <!-- Bottom row -->
  <g text-anchor="middle">
    <rect x="270" y="314" width="280" height="76" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="410" y="344" fill="#e2e8f0" font-size="15" font-weight="700">Tier 2 · Tutor</text>
    <text x="410" y="367" fill="#94a3b8" font-size="12.5">reasoning model, only while you learn</text>

    <rect x="600" y="314" width="250" height="76" rx="12" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="725" y="344" fill="#5eead4" font-size="15" font-weight="700">You</text>
    <text x="725" y="367" fill="#94a3b8" font-size="12.5">Chat · Career Coach · Curriculum</text>
  </g>

  <g stroke="#2dd4bf" stroke-width="2" fill="none">
    <line x1="222" y1="108" x2="267" y2="108" marker-end="url(#arr)"/>
    <line x1="452" y1="108" x2="467" y2="108" marker-end="url(#arr)"/>
    <line x1="652" y1="108" x2="667" y2="108" marker-end="url(#arr)"/>
    <line x1="760" y1="148" x2="760" y2="183" marker-end="url(#arr)"/>
    <line x1="410" y1="280" x2="410" y2="311" marker-end="url(#arr)"/>
    <line x1="268" y1="232" x2="223" y2="232" marker-end="url(#arr)"/>
    <line x1="553" y1="345" x2="597" y2="345" marker-end="url(#arr)"/>
    <line x1="597" y1="360" x2="553" y2="360" marker-end="url(#arr)"/>
  </g>
</svg>
