<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="880" height="230" rx="16" fill="#0f172a"/>
  <text x="30" y="40" fill="#5eead4" font-size="18" font-weight="700">Career Coach: from a job description to a study plan</text>

  <g text-anchor="middle">
    <rect x="30" y="70" width="180" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="120" y="102" fill="#e2e8f0" font-size="15" font-weight="700">Job description</text>
    <rect x="30" y="140" width="180" height="54" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="120" y="172" fill="#e2e8f0" font-size="15" font-weight="700">Your resume</text>

    <rect x="260" y="95" width="180" height="76" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="350" y="126" fill="#e2e8f0" font-size="15" font-weight="700">Skill-gap analysis</text>
    <text x="350" y="149" fill="#94a3b8" font-size="12.5">what the role needs vs. you</text>

    <rect x="490" y="95" width="160" height="76" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="570" y="126" fill="#e2e8f0" font-size="15" font-weight="700">Curriculum plan</text>
    <text x="570" y="149" fill="#94a3b8" font-size="12.5">ordered topics</text>

    <rect x="700" y="95" width="150" height="76" rx="12" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="775" y="126" fill="#5eead4" font-size="15" font-weight="700">Tutoring</text>
    <text x="775" y="149" fill="#94a3b8" font-size="12.5">from your own files</text>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none">
    <path d="M212,97 L236,97 L236,125 L257,125" marker-end="url(#arr)"/>
    <path d="M212,167 L236,167 L236,141 L257,141" marker-end="url(#arr)"/>
    <line x1="442" y1="133" x2="487" y2="133" marker-end="url(#arr)"/>
    <line x1="652" y1="133" x2="697" y2="133" marker-end="url(#arr)"/>
  </g>
</svg>
