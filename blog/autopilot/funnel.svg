<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1324"/><stop offset="1" stop-color="#111D33"/></linearGradient>
  </defs>
  <rect width="400" height="420" rx="18" fill="url(#bg)"/>
  <text x="28" y="40" fill="#60A5FA" font-size="11.5" font-weight="700" letter-spacing="1.6">FROM THOUSANDS TO A SHORT LIST</text>
  <g stroke="#0B1324" stroke-width="2">
    <path d="M28,64 L372,64 L352,120 L48,120 Z" fill="#1E3A8A"/>
    <path d="M50,126 L350,126 L330,182 L70,182 Z" fill="#1D4ED8"/>
    <path d="M72,188 L328,188 L308,244 L92,244 Z" fill="#2563EB"/>
    <path d="M94,250 L306,250 L286,306 L114,306 Z" fill="#0E9F6E"/>
    <path d="M116,312 L284,312 L264,368 L136,368 Z" fill="#34D399"/>
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="200" y="89" fill="#E8EDF5" font-size="13.5">Every listing found</text>
    <text x="200" y="107" fill="#BFD3F5" font-size="11" font-weight="400">all sources, all dates</text>
    <text x="200" y="151" fill="#E8EDF5" font-size="13.5">Duplicates and reposts gone</text>
    <text x="200" y="169" fill="#DBE7FB" font-size="11" font-weight="400">one row per real job</text>
    <text x="200" y="213" fill="#FFFFFF" font-size="13.5">Titles, cities, recent</text>
    <text x="200" y="231" fill="#E8EDF5" font-size="11" font-weight="400">filters, no AI needed</text>
    <text x="200" y="275" fill="#FFFFFF" font-size="13.5">Full description, scored</text>
    <text x="200" y="293" fill="#E8F8F1" font-size="11" font-weight="400">fit and keyword match</text>
    <text x="200" y="337" fill="#0B1324" font-size="13.5">Short list</text>
    <text x="200" y="355" fill="#0B1324" font-size="11" font-weight="400">for me to decide</text>
  </g>
  <text x="200" y="398" text-anchor="middle" fill="#93A1B8" font-size="11">The AI only reads what survives the cheap filters</text>
</svg>
