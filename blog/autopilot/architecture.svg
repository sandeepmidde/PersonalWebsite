<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1324"/><stop offset="1" stop-color="#111D33"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2B47"/><stop offset="1" stop-color="#132036"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.28"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93A1B8"/></marker>
  </defs>
  <rect width="400" height="520" rx="18" fill="url(#bg)"/>
  <text x="28" y="40" fill="#60A5FA" font-size="11.5" font-weight="700" letter-spacing="1.6">HOW THE PIECES CONNECT</text>

  <!-- sources -->
  <rect x="28" y="60" width="344" height="58" rx="12" fill="url(#tile)" stroke="#25324D"/>
  <text x="46" y="84" fill="#E8EDF5" font-size="14" font-weight="700">Job sources</text>
  <text x="46" y="104" fill="#93A1B8" font-size="11.5">LinkedIn listings · job boards · 24 employer career sites</text>
  <line x1="120" y1="122" x2="120" y2="150" stroke="#93A1B8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- extension -->
  <rect x="236" y="150" width="136" height="74" rx="12" fill="url(#tile)" stroke="#25324D"/>
  <text x="252" y="176" fill="#E8EDF5" font-size="13.5" font-weight="700">Chrome extension</text>
  <text x="252" y="196" fill="#93A1B8" font-size="11">captures jobs and</text>
  <text x="252" y="211" fill="#93A1B8" font-size="11">contacts on screen</text>
  <line x1="300" y1="122" x2="300" y2="148" stroke="#93A1B8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- hub -->
  <circle cx="120" cy="214" r="80" fill="url(#glow)"/>
  <rect x="28" y="150" width="184" height="128" rx="14" fill="#14284A" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="46" y="176" fill="#60A5FA" font-size="10.5" font-weight="700" letter-spacing="1.4">THE HUB</text>
  <text x="46" y="198" fill="#E8EDF5" font-size="15" font-weight="700">Desktop app</text>
  <text x="46" y="218" fill="#93A1B8" font-size="11.5">find · score · prepare</text>
  <text x="46" y="234" fill="#93A1B8" font-size="11.5">apply · network · track</text>
  <rect x="46" y="246" width="148" height="22" rx="6" fill="#0B1324" stroke="#25324D"/>
  <text x="120" y="261" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">local SQLite file</text>
  <line x1="234" y1="196" x2="216" y2="196" stroke="#93A1B8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="304" y="244" text-anchor="middle" fill="#93A1B8" font-size="10">localhost-only bridge</text>

  <!-- AI -->
  <rect x="236" y="256" width="136" height="58" rx="12" fill="url(#tile)" stroke="#25324D"/>
  <text x="252" y="281" fill="#E8EDF5" font-size="13.5" font-weight="700">AI provider</text>
  <text x="252" y="300" fill="#93A1B8" font-size="11">Gemini or Claude</text>
  <line x1="214" y1="270" x2="234" y2="280" stroke="#93A1B8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="304" y="330" text-anchor="middle" fill="#93A1B8" font-size="10">minimum text only</text>

  <!-- cloud -->
  <line x1="120" y1="282" x2="120" y2="350" stroke="#93A1B8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="128" y="322" fill="#93A1B8" font-size="10">sync results</text>
  <rect x="28" y="352" width="184" height="78" rx="12" fill="url(#tile)" stroke="#25324D"/>
  <text x="46" y="378" fill="#E8EDF5" font-size="13.5" font-weight="700">Cloud morning run</text>
  <text x="46" y="398" fill="#93A1B8" font-size="11">GitHub Actions, when the</text>
  <text x="46" y="413" fill="#93A1B8" font-size="11">laptop is off</text>
  <line x1="214" y1="390" x2="234" y2="390" stroke="#93A1B8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- phone -->
  <rect x="236" y="352" width="136" height="78" rx="12" fill="url(#tile)" stroke="#25324D"/>
  <text x="252" y="378" fill="#E8EDF5" font-size="13.5" font-weight="700">Phone page</text>
  <text x="252" y="398" fill="#93A1B8" font-size="11">latest matches and</text>
  <text x="252" y="413" fill="#93A1B8" font-size="11">a Run now button</text>

  <!-- human -->
  <rect x="28" y="452" width="344" height="46" rx="12" fill="#0F2A22" stroke="#34D399" stroke-width="1.6"/>
  <text x="200" y="480" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700">Submit and Send always stay a human click</text>
</svg>
