<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1324"/><stop offset="1" stop-color="#111D33"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2B47"/><stop offset="1" stop-color="#132036"/></linearGradient>
  </defs>
  <rect width="400" height="440" rx="18" fill="url(#bg)"/>
  <text x="28" y="40" fill="#34D399" font-size="11.5" font-weight="700" letter-spacing="1.6">WHO DOES WHAT</text>
  <text x="28" y="72" fill="#60A5FA" font-size="12" font-weight="700">SOFTWARE</text>
  <text x="214" y="72" fill="#34D399" font-size="12" font-weight="700">ME</text>
  <g font-size="12.5">
    <rect x="28" y="84" width="172" height="44" rx="10" fill="url(#tile)" stroke="#25324D"/><text x="42" y="111" fill="#E8EDF5">Search and de-duplicate</text>
    <rect x="212" y="84" width="160" height="44" rx="10" fill="#0F2A22" stroke="#34D399" stroke-opacity="0.6"/><text x="226" y="111" fill="#E8EDF5">Pick titles and cities</text>
    <rect x="28" y="140" width="172" height="44" rx="10" fill="url(#tile)" stroke="#25324D"/><text x="42" y="167" fill="#E8EDF5">Score fit, match keywords</text>
    <rect x="212" y="140" width="160" height="44" rx="10" fill="#0F2A22" stroke="#34D399" stroke-opacity="0.6"/><text x="226" y="167" fill="#E8EDF5">Decide what to apply for</text>
    <rect x="28" y="196" width="172" height="44" rx="10" fill="url(#tile)" stroke="#25324D"/><text x="42" y="223" fill="#E8EDF5">Draft letters and edits</text>
    <rect x="212" y="196" width="160" height="44" rx="10" fill="#0F2A22" stroke="#34D399" stroke-opacity="0.6"/><text x="226" y="223" fill="#E8EDF5">Approve every change</text>
    <rect x="28" y="252" width="172" height="44" rx="10" fill="url(#tile)" stroke="#25324D"/><text x="42" y="279" fill="#E8EDF5">Fill the form</text>
    <rect x="212" y="252" width="160" height="44" rx="10" fill="#0F2A22" stroke="#34D399" stroke-opacity="0.6"/><text x="226" y="279" fill="#E8EDF5">Press Submit</text>
    <rect x="28" y="308" width="172" height="44" rx="10" fill="url(#tile)" stroke="#25324D"/><text x="42" y="335" fill="#E8EDF5">Draft the message</text>
    <rect x="212" y="308" width="160" height="44" rx="10" fill="#0F2A22" stroke="#34D399" stroke-opacity="0.6"/><text x="226" y="335" fill="#E8EDF5">Press Send</text>
  </g>
  <rect x="28" y="370" width="344" height="46" rx="12" fill="url(#tile)" stroke="#F87171" stroke-opacity="0.6"/>
  <text x="200" y="391" text-anchor="middle" fill="#F87171" font-size="12" font-weight="700">Never automated</text>
  <text x="200" y="407" text-anchor="middle" fill="#93A1B8" font-size="11">CAPTCHAs, legal answers, bulk LinkedIn actions</text>
</svg>
