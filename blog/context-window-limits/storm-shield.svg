<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="400" height="470" rx="18" fill="#FFF7E6" stroke="#1F1147" stroke-width="4"/>
  <text x="24" y="40" fill="#D97706" font-size="13" font-weight="700" letter-spacing="1.5">ONE QUESTION, TWO WAYS</text>
  <!-- without -->
  <rect x="24" y="56" width="352" height="180" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="44" y="84" fill="#DC2626" font-size="15" font-weight="700">Pour in the whole book</text>
  <g stroke="#1F1147" stroke-width="1.5">
    <rect x="48" y="104" width="18" height="70" rx="2" fill="#DB2777"/><rect x="68" y="104" width="18" height="70" rx="2" fill="#D97706"/><rect x="88" y="104" width="18" height="70" rx="2" fill="#7C3AED"/><rect x="108" y="104" width="18" height="70" rx="2" fill="#0EA5E9"/><rect x="128" y="104" width="18" height="70" rx="2" fill="#15803D"/><rect x="148" y="104" width="18" height="70" rx="2" fill="#DB2777"/><rect x="168" y="104" width="18" height="70" rx="2" fill="#D97706"/>
  </g>
  <text x="117" y="194" text-anchor="middle" fill="#5B4B73" font-size="12">all seven books</text>
  <path d="M196,138 L232,138" stroke="#1F1147" stroke-width="2"/><path d="M226,131 L236,138 L226,145" fill="none" stroke="#1F1147" stroke-width="2"/>
  <rect x="244" y="108" width="112" height="62" rx="10" fill="#FEE2E2" stroke="#1F1147" stroke-width="1.5"/>
  <text x="300" y="136" text-anchor="middle" fill="#1F1147" font-size="14" font-weight="700">AI</text>
  <text x="300" y="155" text-anchor="middle" fill="#DC2626" font-size="12">overflowing</text>
  <text x="44" y="220" fill="#DC2626" font-size="13" font-style="italic">too much at once, the answer gets lost</text>
  <!-- with -->
  <rect x="24" y="252" width="352" height="196" rx="12" fill="#FFF1D6" stroke="#15803D" stroke-width="2"/>
  <text x="44" y="280" fill="#15803D" font-size="15" font-weight="700">Hand over the right page</text>
  <g stroke="#1F1147" stroke-width="1.5">
    <rect x="48" y="300" width="18" height="70" rx="2" fill="#DB2777"/><rect x="68" y="300" width="18" height="70" rx="2" fill="#D97706"/><rect x="88" y="300" width="18" height="70" rx="2" fill="#7C3AED"/><rect x="108" y="300" width="18" height="70" rx="2" fill="#0EA5E9"/><rect x="128" y="300" width="18" height="70" rx="2" fill="#15803D"/><rect x="148" y="300" width="18" height="70" rx="2" fill="#DB2777"/><rect x="168" y="300" width="18" height="70" rx="2" fill="#D97706"/>
  </g>
  <text x="117" y="390" text-anchor="middle" fill="#5B4B73" font-size="12">books stay on the shelf</text>
  <rect x="200" y="318" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#1F1147" stroke-width="1.5"/>
  <line x1="206" y1="328" x2="224" y2="328" stroke="#5B4B73" stroke-width="1.5"/><line x1="206" y1="336" x2="224" y2="336" stroke="#5B4B73" stroke-width="1.5"/><line x1="206" y1="344" x2="220" y2="344" stroke="#5B4B73" stroke-width="1.5"/>
  <text x="215" y="372" text-anchor="middle" fill="#5B4B73" font-size="11">one page</text>
  <path d="M234,337 L250,337" stroke="#1F1147" stroke-width="2"/><path d="M244,330 L254,337 L244,344" fill="none" stroke="#1F1147" stroke-width="2"/>
  <rect x="260" y="306" width="96" height="62" rx="10" fill="#DCFCE7" stroke="#1F1147" stroke-width="1.5"/>
  <text x="308" y="334" text-anchor="middle" fill="#1F1147" font-size="14" font-weight="700">AI</text>
  <text x="308" y="353" text-anchor="middle" fill="#15803D" font-size="12">clear answer</text>
  <text x="44" y="424" fill="#15803D" font-size="13" font-style="italic">like the hill, only what is needed gets through</text>
</svg>
